name: Build SharedHUD TIPA

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: brew install xcodegen ldid
      - name: Validate sources
        run: sh scripts/validate.sh
      - name: Build TrollStore package
        run: sh build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: SharedHUD-tipa
          path: dist/SharedHUD.tipa
          if-no-files-found: error
