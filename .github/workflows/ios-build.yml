name: Build iOS

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app || sudo xcode-select -s /Applications/Xcode.app

      - name: Build unsigned device app
        run: |
          xcodebuild \
            -project KingShared.xcodeproj \
            -scheme KingShared \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build

      - name: Package unsigned IPA
        run: |
          rm -rf Payload KingShared-unsigned.ipa
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/KingShared.app Payload/
          /usr/bin/zip -qry KingShared-unsigned.ipa Payload

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: KingShared-unsigned-ipa
          path: KingShared-unsigned.ipa

      - name: Upload app bundle
        uses: actions/upload-artifact@v4
        with:
          name: KingShared-app
          path: build/Build/Products/Release-iphoneos/KingShared.app

  simulator-check:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app || sudo xcode-select -s /Applications/Xcode.app
      - name: Build simulator target
        run: |
          xcodebuild \
            -project KingShared.xcodeproj \
            -scheme KingShared \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build-simulator \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build
