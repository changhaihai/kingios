name: Build iOS

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app || sudo xcode-select -s /Applications/Xcode.app

      - name: Build unsigned device app
        run: |
          set -o pipefail
          xcodebuild \
            -project KingShared.xcodeproj \
            -scheme KingShared \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" \
            build 2>&1 | tee device-build.log

      - name: Report device build errors
        if: failure()
        run: |
          if [ -f device-build.log ]; then
            grep -E "error:|fatal error:|The project|scheme|BUILD FAILED|Command .* failed" device-build.log | tail -40 | while IFS= read -r line; do echo "::error::$line"; done
          fi

      - name: Upload device build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: device-build-log
          path: device-build.log

      - name: Package unsigned IPA
        run: |
          rm -rf Payload KingShared-unsigned.ipa
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/KingShared.app Payload/
          codesign --force --deep --sign - Payload/KingShared.app
          /usr/bin/zip -qry KingShared-unsigned.ipa Payload

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: KingShared-unsigned-ipa
          path: KingShared-unsigned.ipa

      - name: Upload app bundle
        uses: actions/upload-artifact@v4
        with:
          name: KingShared-app
          path: build/Build/Products/Release-iphoneos/KingShared.app

  simulator-check:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app || sudo xcode-select -s /Applications/Xcode.app
      - name: Build simulator target
        run: |
          set -o pipefail
          xcodebuild \
            -project KingShared.xcodeproj \
            -scheme KingShared \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build-simulator \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build 2>&1 | tee simulator-build.log

      - name: Report simulator build errors
        if: failure()
        run: |
          if [ -f simulator-build.log ]; then
            grep -E "error:|fatal error:|The project|scheme|BUILD FAILED|Command .* failed" simulator-build.log | tail -40 | while IFS= read -r line; do echo "::error::$line"; done
          fi

      - name: Upload simulator build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-build-log
          path: simulator-build.log
