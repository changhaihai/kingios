name: Build unsigned IPA (TrollStore)

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned, iphoneos)
        run: |
          xcodebuild -project KingShare.xcodeproj -scheme KingShare \
            -configuration Release -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO

      - name: Package IPA
        run: |
          set -euo pipefail
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/KingShare.app Payload/
          test -x Payload/KingShare.app/KingShare
          zip -qry KingShare-unsigned.ipa Payload
          unzip -l KingShare-unsigned.ipa | grep 'Payload/KingShare.app/KingShare$'

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: KingShare-unsigned-ipa
          path: KingShare-unsigned.ipa
          if-no-files-found: error

      - name: Publish release on tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: KingShare-unsigned.ipa
          generate_release_notes: true
