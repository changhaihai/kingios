name: Build unsigned IPA (TrollStore)

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Install ldid
        run: brew install ldid

      - name: Generate Xcode project
        run: |
          xcodegen generate
          # XcodeGen currently emits objectVersion 77, which Xcode 15.4
          # (the macos-14 runner toolchain) cannot open.
          python3 -c 'from pathlib import Path; p=Path("KingShare.xcodeproj/project.pbxproj"); t=p.read_text(); q=chr(34); p.write_text(t.replace("objectVersion = 77;", "objectVersion = 56;").replace("compatibilityVersion = "+q+"Xcode 16.0"+q+";", "compatibilityVersion = "+q+"Xcode 15.0"+q+";"))'

      - name: Build (unsigned, iphoneos)
        run: |
          xcodebuild -project KingShare.xcodeproj -scheme KingShare \
            -configuration Release -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO
          xcodebuild -project KingShare.xcodeproj -scheme HaiHUD \
            -configuration Release -sdk iphoneos -derivedDataPath build-hud \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO

      - name: Sign, embed helper, and package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/KingShare.app Payload/
          test -x build-hud/Build/Products/Release-iphoneos/HaiHUD.app/HaiHUD
          mkdir -p Payload/KingShare.app/Frameworks
          cp -R build-hud/Build/Products/Release-iphoneos/HaiHUD.app Payload/KingShare.app/Frameworks/
          # The helper is a separately signed executable so TrollStore can
          # launch it as the root-spawned HUD process.
          ldid -SKingShare/HUDHelper/entitlements.plist Payload/KingShare.app/Frameworks/HaiHUD.app/HaiHUD
          ldid -SKingShare/HUDHelper/entitlements.plist Payload/KingShare.app/KingShare
          test -f Payload/KingShare.app/Info.plist
          test -x Payload/KingShare.app/KingShare
          test -f Payload/KingShare.app/Frameworks/HaiHUD.app/Info.plist
          test -x Payload/KingShare.app/Frameworks/HaiHUD.app/HaiHUD
          zip -qry KingShare-unsigned.ipa Payload
          ls -lh KingShare-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: HaiIOS-TrollStore
          path: KingShare-unsigned.ipa
          if-no-files-found: error

      - name: Publish release on tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: KingShare-unsigned.ipa
          generate_release_notes: true
